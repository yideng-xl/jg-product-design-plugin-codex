ion><option value="2">192.0.2.2</option></select></div></div><div class="wg-field"><label>设备名称：</label><div class="wg-control"><input class="wg-input" readonly id="inspection-name" value="示例设备 01"></div></div><div class="wg-field"><label>网络名称：</label><div class="wg-control"><input class="wg-input" readonly id="inspection-network" value="示例网络甲"></div></div><div class="wg-field"><label>设备厂商：</label><div class="wg-control"><input class="wg-input" readonly id="inspection-vendor" value="示例厂商"></div></div><div class="wg-field"><label>型号：</label><div class="wg-control"><input class="wg-input" readonly id="inspection-model" value="示例型号"></div></div><div class="wg-field"><label>软件版本：</label><div class="wg-control"><input class="wg-input" readonly id="inspection-version" value="示例版本"></div></div></div><h3 class="wg-section-title">巡检内容</h3><div class="wg-table-wrap"><table class="wg-table" data-wg-static><thead><tr><th>序号</th><th>巡检项</th><th>执行指令</th><th>标准值</th></tr></thead><tbody><tr><td>1</td><td>示例检查项</td><td>示例只读指令</td><td>示例标准值</td></tr></tbody></table></div><p class="wg-muted" id="inspection-result" role="status"></p></div><div class="wg-modal-footer"><button class="wg-btn" data-wg-modal-close>取消</button><button class="wg-btn wg-primary" id="save-inspection-device">保存</button></div></dialog><script src="../wg.js?v=20261021"></script><script>let deviceCount=0;const addDevice=i=>{if(document.querySelector('#task-devices [data-device="'+i+'"]')){document.getElementById('inspection-result').textContent='该示例设备已添加';return}deviceCount++;const tr=document.createElement('tr');tr.dataset.device=i;tr.innerHTML='<td>'+deviceCount+'</td><td>示例设备 0'+i+'</td><td>192.0.2.'+i+'</td><td>示例网络'+(i==='2'?'乙':'甲')+'</td><td>示例厂商</td><td>示例型号</td><td>示例版本</td><td><button class="wg-btn wg-text">移除</button></td>';tr.querySelector('button').onclick=()=>{tr.remove();Array.from(document.getElementById('task-devices').rows).forEach((r,j)=>r.cells[0].textContent=j+1);deviceCount=document.getElementById('task-devices').rows.length};document.getElementById('task-devices').append(tr);WG.closeModal('inspection-device')};document.getElementById('inspection-ip').onchange=e=>{document.getElementById('inspection-name').value='示例设备 0'+e.target.value;document.getElementById('inspection-network').value='示例网络'+(e.target.value==='2'?'乙':'甲');document.getElementById('inspection-result').textContent=''};document.getElementById('save-inspection-device').onclick=()=>addDevice(document.getElementById('inspection-ip').value);document.getElementById('save-task').onclick=()=>{if(document.getElementById('task-form').reportValidity())document.getElementById('task-result').textContent='示例已保存，刷新后清除'};</script></body></html>
