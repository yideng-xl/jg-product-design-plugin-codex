<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><script data-wg-theme-bootstrap>(function(){var theme='green';try{var requested=new URLSearchParams(location.search).get('theme');if(requested==='blue'||requested==='green'){theme=requested;try{localStorage.setItem('wg-prototype-theme',theme)}catch(e){}}else{try{var saved=localStorage.getItem('wg-prototype-theme');if(saved==='blue'||saved==='green')theme=saved}catch(e){}}}catch(e){}document.documentElement.dataset.wgTheme=theme;})();</script><meta name="viewport" content="width=device-width, initial-scale=1"><title>拓扑监控 · 产品 B 原型资产</title><link rel="stylesheet" href="../wg.css?v=20261021"></head><body class="wg-app wg-template"><script>document.body.dataset.wgTheme=document.documentElement.dataset.wgTheme||"green";</script><header class="wg-header"><a class="wg-brand" href="../index.html">产品 B</a><nav class="wg-topnav" aria-label="产品导航"><div class="wg-nav-group"><button class="wg-nav-item" data-wg-menu="menu-0" type="button"><svg class="wg-icon" aria-hidden="true"><use href="../icons.svg#assets"></use></svg>资产管理</button><div class="wg-mega-menu" id="menu-0" hidden><div class="wg-mega-column"><a href="list.html">网络设备</a><a href="tree-list.html">组织架构</a><a href="device-detail.html">设备详情</a></div></div></div><div class="wg-nav-group"><button class="wg-nav-item" aria-current="page" data-wg-menu="menu-1" type="button"><svg class="wg-icon" aria-hidden="true"><use href="../icons.svg#monitor"></use></svg>监控管理</button><div class="wg-mega-menu" id="menu-1" hidden><div class="wg-mega-column"><a href="alarm-monitor.html">实时告警</a><a href="topology.html">拓扑监控</a></div></div></div><div class="wg-nav-group"><button class="wg-nav-item" data-wg-menu="menu-2" type="button"><svg class="wg-icon" aria-hidden="true"><use href="../icons.svg#operations"></use></svg>运行管理</button><div class="wg-mega-menu" id="menu-2" hidden><div class="wg-mega-column"><a href="task-editor.html">巡检任务</a></div></div></div><div class="wg-nav-group"><button class="wg-nav-item" data-wg-menu="menu-3" type="button"><svg class="wg-icon" aria-hidden="true"><use href="../icons.svg#reports"></use></svg>报表管理</button><div class="wg-mega-menu" id="menu-3" hidden><div class="wg-mega-column"><a href="report.html">网络覆盖率</a></div></div></div><div class="wg-nav-group"><button class="wg-nav-item" data-wg-menu="menu-4" type="button"><svg class="wg-icon" aria-hidden="true"><use href="../icons.svg#system"></use></svg>系统管理</button><div class="wg-mega-menu" id="menu-4" hidden><div class="wg-mega-column"><a href="tree-list.html">组织架构</a></div></div></div></nav><div class="wg-header-right"><span class="wg-account">示例账号</span><div class="wg-theme-switch" role="group" aria-label="界面主题"><button type="button" data-wg-theme-option="green" aria-pressed="true">绿色主题</button><button type="button" data-wg-theme-option="blue" aria-pressed="false">蓝色深色主题</button></div></div></header><div class="wg-workspace-shell"><button class="wg-tabs-scroll" data-wg-tabs-scroll="-1" aria-label="向左滚动标签">‹</button><nav class="wg-workspace-tabs" aria-label="工作区"><a class="wg-workspace-tab" href="../index.html">组件目录</a><a class="wg-workspace-tab"  href="list.html">网络设备</a><a class="wg-workspace-tab"  href="tree-list.html">组织架构</a><a class="wg-workspace-tab"  href="device-detail.html">设备详情</a><a class="wg-workspace-tab"  href="alarm-monitor.html">实时告警</a><a class="wg-workspace-tab"  href="task-editor.html">巡检任务</a><a class="wg-workspace-tab"  href="report.html">网络覆盖率</a><a class="wg-workspace-tab" aria-current=page href="topology.html">拓扑监控</a></nav><button class="wg-tabs-scroll" data-wg-tabs-scroll="1" aria-label="向右滚动标签">›</button></div><main class="wg-main"><section class="wg-content"><div class="wg-tree-layout" style="grid-template-columns:300px minmax(0,1fr)"><aside class="wg-tree-pane"><h2 class="wg-section-title">网络拓扑</h2><div class="wg-tree"><ul><li><div class="wg-tree-node"><button data-wg-tree-select>示例机构</button></div></li></ul></div></aside><section><div class="wg-toolbar"><input class="wg-input" placeholder="设备名称" id="topology-search" aria-label="设备名称"><button type="button" class="wg-btn wg-primary" id="topology-find">搜索</button><button type="button" class="wg-btn" id="topology-reset">重置</button><label class="wg-check"><input id="physical" type="checkbox" checked>物理链路</label><label class="wg-check"><input id="logical" type="checkbox" checked>逻辑链路</label><span class="wg-spacer"></span><button class="wg-btn" id="load-demo">载入演示节点</button><button type="button" class="wg-btn" id="zoom-in">放大</button><button type="button" class="wg-btn" id="zoom-out">缩小</button></div><div class="wg-toolbar"><span>标签显示</span><label class="wg-radio"><input type="radio" name="node-label" value="全部" checked>全部</label><label class="wg-radio"><input type="radio" name="node-label" value="设备名称">设备名称</label><label class="wg-radio"><input type="radio" name="node-label" value="IP地址">IP 地址</label><span id="topology-count" class="wg-muted">设备 0 台 · 链路 0 条</span></div><p class="wg-muted">默认展示实测空画布。载入演示节点后可体验缩放、搜索和链路显隐，节点布局尚未校准。</p><div class="wg-tree-layout" style="grid-template-columns:minmax(0,1fr)" id="demo-topology-layout"><div style="overflow:auto;border:1px solid var(--wg-border);min-height:460px"><svg id="topology" viewBox="0 0 900 440" role="img" aria-label="三个虚拟设备组成的演示拓扑" style="width:100%;min-width:650px"><g id="topology-scene" style="display:none"><g data-link-type="physical" stroke="var(--wg-primary)" stroke-width="2"><path d="M450 100L220 300M450 100L680 300" fill="none"/></g><g data-link-type="logical" stroke="var(--wg-muted)" stroke-width="2" stroke-dasharray="6 5"><path d="M220 300H680"/></g><g data-node="示例核心设备" role="button" tabindex="0" aria-label="选择示例核心设备" style="cursor:pointer"><rect x="390" y="76" width="120" height="48" rx="4" fill="var(--wg-surface)" stroke="var(--wg-primary)" stroke-width="2"/><text x="450" y="105" text-anchor="middle" fill="var(--wg-text)" font-size="14">示例核心设备</text></g><g data-node="示例接入甲" role="button" tabindex="0" aria-label="选择示例接入甲" style="cursor:pointer"><rect x="160" y="276" width="120" height="48" rx="4" fill="var(--wg-surface)" stroke="var(--wg-primary)" stroke-width="2"/><text x="220" y="305" text-anchor="middle" fill="var(--wg-text)" font-size="14">示例接入甲</text></g><g data-node="示例接入乙" role="button" tabindex="0" aria-label="选择示例接入乙" style="cursor:pointer"><rect x="620" y="276" width="120" height="48" rx="4" fill="var(--wg-surface)" stroke="var(--wg-primary)" stroke-width="2"/><text x="680" y="305" text-anchor="middle" fill="var(--wg-text)" font-size="14">示例接入乙</text></g></g></svg></div><aside class="wg-version-card" id="demo-node-info" hidden><h3>节点信息</h3><p id="selected-node">请点击节点</p><p id="node-status" class="wg-muted">—</p><p id="search-result" role="status"></p></aside></div></section></div></section><p class="wg-muted" style="padding:0 20px;font-size:12px">本地组件示例，全部数据为虚拟记录。操作仅影响当前页面。</p></main><script src="../wg.js?v=20261021"></script><script>const nodes=Array.from(document.querySelectorAll('[data-node]'));const choose=n=>{nodes.forEach(x=>x.querySelector('rect').setAttribute('stroke-width',x===n?'4':'2'));document.getElementById('selected-node').textContent=n.dataset.node;document.getElementById('node-status').textContent='在线 · 虚拟示例节点'};nodes.forEach(n=>{n.onclick=()=>choose(n);n.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(n)}}});['physical','logical'].forEach(type=>document.getElementById(type).onchange=e=>document.querySelector('[data-link-type='+type+']').style.display=e.target.checked?'':'none');let scale=1;const zoom=()=>document.getElementById('topology-scene').setAttribute('transform','translate('+450*(1-scale)+' '+220*(1-scale)+') scale('+scale+')');document.getElementById('zoom-in').onclick=()=>{scale=Math.min(2,scale+.2);zoom()};document.getElementById('zoom-out').onclick=()=>{scale=Math.max(.6,scale-.2);zoom()};document.getElementById('topology-find').onclick=()=>{const q=document.getElementById('topology-search').value.trim();const found=nodes.find(n=>q&&n.dataset.node.includes(q));document.getElementById('search-result').textContent=found?'已定位节点':'未找到匹配节点';if(found)choose(found)};document.getElementById('topology-reset').onclick=()=>{scale=1;zoom();document.getElementById('topology-search').value='';document.getElementById('search-result').textContent='';document.getElementById('selected-node').textContent='请点击节点';document.getElementById('node-status').textContent='—';nodes.forEach(n=>n.querySelector('rect').setAttribute('stroke-width','2'));['physical','logical'].forEach(t=>{document.getElementById(t).checked=true;document.querySelector('[data-link-type='+t+']').style.display=''})};</script><script>document.getElementById('load-demo').onclick=()=>{document.getElementById('topology-scene').style.display='';document.getElementById('demo-node-info').hidden=false;document.getElementById('demo-topology-layout').style.gridTemplateColumns='minmax(0,1fr) 260px';document.getElementById('topology-count').textContent='设备 3 台 · 链路 3 条（演示）';document.getElementById('load-demo').textContent='演示节点已载入';document.getElementById('load-demo').disabled=true};document.querySelectorAll('[name=node-label]').forEach(r=>r.onchange=()=>document.querySelectorAll('[data-node]').forEach((n,i)=>n.querySelector('text').textContent=r.value==='IP地址'?'192.0.2.'+(i+1):r.value==='全部'?n.dataset.node+' / .'+(i+1):n.dataset.node));</script></body></html>
